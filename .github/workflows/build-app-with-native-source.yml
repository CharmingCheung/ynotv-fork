name: Build macOS app with native source

on:
  workflow_dispatch:
    inputs:
      native_ref:
        description: ynotv-native branch, tag, or commit to build
        required: true
        default: master
        type: string
      use_self_hosted:
        description: Run on the local self-hosted runner
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  YNOTV_NATIVE_REF: ${{ inputs.native_ref }}

concurrency:
  group: native-source-macos-${{ github.ref }}-${{ inputs.native_ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    name: macOS arm64 app
    runs-on: ${{ inputs.use_self_hosted && 'self-hosted' || 'macos-15' }}
    steps:
      - name: Checkout ynoTV
        uses: actions/checkout@v5

      - name: Checkout ynotv-native source
        uses: actions/checkout@v5
        with:
          repository: CharmingCheung/ynotv-native
          ref: ${{ inputs.native_ref }}
          path: ynotv-native

      - name: Resolve native source revision
        id: native-revision
        run: echo "sha=$(git -C ynotv-native rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore Native DASH runtime
        id: native-runtime-cache
        uses: actions/cache@v4
        with:
          path: ynotv-native/.work/stage
          key: native-runtime-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-revision.outputs.sha }}

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app/src-tauri -> target
          cache-on-failure: true

      - name: Install native build dependencies
        run: brew install mpv ffmpeg openssl@3 meson ninja pkg-config

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build Native DASH runtime from source
        if: steps.native-runtime-cache.outputs.cache-hit != 'true'
        run: |
          version=$(tr -d '[:space:]' < ynotv-native/VERSION)
          ./ynotv-native/scripts/build-macos.sh "$version"

      - name: Install Native DASH runtime
        run: node scripts/setup-native-runtime.mjs --from ynotv-native/.work/stage

      - name: Build sidecars
        run: |
          bash scripts/download-mpv-tauri.sh
          node packages/app/scripts/download-ffmpeg.js

      - name: Prepare self-contained macOS runtime
        run: node scripts/prepare-macos-bundle-runtime.mjs

      - name: Record native source revision
        run: |
          mkdir -p build-metadata
          printf 'app=%s\nnative=%s\nnative_ref=%s\n' \
            "$(git rev-parse HEAD)" \
            "$(git -C ynotv-native rev-parse HEAD)" \
            "$YNOTV_NATIVE_REF" > build-metadata/revisions.txt

      - name: Build macOS app
        env:
          YNOTV_NATIVE_DASH_LIBMPV_DIR: ${{ github.workspace }}/packages/app/src-tauri/native-dash-libmpv
          YNOTV_NATIVE_DASH_PACKET_PRODUCER: ${{ github.workspace }}/packages/app/src-tauri/native-dash-libmpv/cenc_component_producer
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/packages/app/src-tauri/native-dash-libmpv
          VITE_TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          VITE_TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          VITE_OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
        run: pnpm tauri build --bundles dmg --ci --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Verify self-contained macOS bundle
        run: |
          app=packages/app/src-tauri/target/release/bundle/macos/ynoTV.app
          node scripts/audit-macos-bundle.mjs "$app"

      - name: Upload macOS package
        uses: actions/upload-artifact@v6
        with:
          name: ynotv-macos-arm64-native-source
          path: |
            packages/app/src-tauri/target/release/bundle/dmg/*.dmg
            build-metadata/revisions.txt
          if-no-files-found: error
          retention-days: 14
