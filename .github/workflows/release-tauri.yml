name: Release Tauri App

on:
  push:
    tags:
      - 'v*'
      # v-assets is a non-app release that only hosts binary dependencies
      # (e.g. libmpv-2.dll) for the setup-libmpv script. Exclude it so pushing
      # that tag doesn't trigger a full app build/publish.
      - '!v-assets'

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install 7z (Windows)
        run: choco install 7zip -y

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download MPV (Tauri Sidecar)
        run: |
          bash scripts/download-mpv-tauri.sh
          echo "Checking if mpv binary was created:"
          ls -la packages/app/src-tauri/bin/ || echo "bin directory not found or empty"
        shell: bash

      - name: Download FFmpeg (Tauri Sidecar)
        run: |
          cd packages/app
          node scripts/download-ffmpeg.js
          cd ../..
          echo "Checking if FFmpeg binary was created:"
          ls -la packages/app/src-tauri/bin/ || echo "bin directory not found or empty"
        shell: bash

      - name: Setup libmpv (Windows)
        if: runner.os == 'Windows'
        run: |
          powershell -ExecutionPolicy Bypass -File packages/app/src-tauri/setup-libmpv.ps1
          echo "LIBMPV_PATH=$GITHUB_WORKSPACE/packages/app/src-tauri/libmpv" >> $GITHUB_ENV
        shell: bash

      - name: Setup libmpv (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install mpv pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix mpv)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> $GITHUB_ENV

      - name: Read release notes
        id: release-notes
        run: |
          # Try to read CHANGELOG.md for this version
          VERSION=${{ github.ref_name }}
          if [ -f CHANGELOG.md ]; then
            # Extract notes for this version (everything between this version and the next)
            NOTES=$(sed -n "/^ *## *$VERSION/,/^ *## /p" CHANGELOG.md | sed '$d' | tail -n +2)
            if [ -z "$NOTES" ]; then
              NOTES="See CHANGELOG.md for full release notes."
            fi
          else
            NOTES="See the assets to download this version and install."
          fi
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        shell: bash

      - name: Build Tauri App
        id: tauri-build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          VITE_TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          VITE_OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Release ${{ github.ref_name }}'
          releaseBody: ${{ steps.release-notes.outputs.body }}
          prerelease: false

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            packages/app/src-tauri/target/release/bundle/**/*.exe
            packages/app/src-tauri/target/release/bundle/**/*.msi
            packages/app/src-tauri/target/release/bundle/**/*.zip
        continue-on-error: true

      - name: Check build status
        if: steps.tauri-build.outcome == 'failure'
        run: |
          echo "::warning::Tauri build failed"
